# A release, when a version is tagged (git tag v0.14.0-beta, pushed): the regression tests, then RazorCAD.exe and
# RazorCAD-Setup-<version>.exe built (installer/build_installer.bat), and a draft release made on GitHub with the
# setup, its read-me and checksums, and notes from CHANGELOG.md. Nothing is published: the draft waits for review.
# It runs only for a version tag (never on ordinary pushes), and the tag must match version.txt. A tag that has a
# release already (one published by hand, with a setup built and signed on a PC) is left alone.
#
# The tests are tests.yml's (called here): split over 6 machines side by side, some 15 minutes; the build waits for
# all of them to pass.
#
# Code signing, when set up (installer/SIGNING.md): repository secrets RAZORCAD_SIGN_PFX_BASE64 (the .pfx,
# base64-encoded) and RAZORCAD_SIGN_PASSWORD; without them the files are built unsigned.
name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  # (first, quickly: is there a release for this tag already, and does the tag match version.txt?)
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Check for a release, and the tag against version.txt
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo 'A release for this tag exists already: nothing to do.'
            exit 0
          fi
          echo 'skip=false' >> "$GITHUB_OUTPUT"
          ver=$(tr -d '\r\n ' < version.txt)
          if [ "v$ver" != "$TAG" ]; then
            echo "::error::The tag $TAG does not match version.txt ($ver): set version.txt and tag again."
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

  tests:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    uses: ./.github/workflows/tests.yml

  release:
    needs: [prepare, tests]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # (the earlier tags, for the release notes)

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install the build tools
        run: python -m pip install --upgrade pip pywebview pyinstaller pillow

      - name: Set up code signing (when the secrets are there)
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.RAZORCAD_SIGN_PFX_BASE64 }}
        run: |
          if ($env:PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP 'razorcad-sign.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
            "RAZORCAD_SIGN_PFX=$pfx" >> $env:GITHUB_ENV
            'Signing: set up'
          } else { 'Signing: not set up (the files are built unsigned)' }

      - name: Build RazorCAD and the setup
        shell: cmd
        run: call installer\build_installer.bat
        env:
          RAZORCAD_SIGN_PASSWORD: ${{ secrets.RAZORCAD_SIGN_PASSWORD }}

      - name: Gather the release files
        shell: pwsh
        run: |
          $out = Join-Path (Split-Path $env:GITHUB_WORKSPACE) 'RazorCAD Install'
          $dist = Join-Path $env:RUNNER_TEMP 'release'
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item (Join-Path $out "RazorCAD-Setup-$env:VERSION.exe") $dist
          Copy-Item (Join-Path $out 'Read me first.txt') (Join-Path $dist 'Read-me-first.txt')
          Get-ChildItem $dist -File | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content -Encoding utf8 (Join-Path $dist 'SHA256SUMS.txt')
          python tools/release_notes.py $env:VERSION --out (Join-Path $env:RUNNER_TEMP 'notes.md')
          "DIST=$dist" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v6
        with:
          name: RazorCAD-${{ env.VERSION }}
          path: ${{ env.DIST }}

      - name: Draft the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $a = @('release', 'create', '${{ github.ref_name }}', '--draft', '--title', "RazorCAD $env:VERSION", '--notes-file', (Join-Path $env:RUNNER_TEMP 'notes.md'))
          if ($env:VERSION -match '-') { $a += '--prerelease' }   # (a beta)
          $a += Get-ChildItem $env:DIST -File | ForEach-Object { $_.FullName }
          gh @a
