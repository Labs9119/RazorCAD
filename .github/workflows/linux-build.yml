# An experimental Linux build: RazorCAD as an AppImage, made on Ubuntu with build_linux.sh and smoke-tested in a
# virtual display (it starts, its window opens and the geometry kernel gets ready). Started by hand from the Actions
# tab (Run workflow); the AppImage is kept as the run's artifact.
name: Linux build

on:
  workflow_dispatch:

jobs:
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: System packages (WebKitGTK, GTK, a virtual display)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 libgirepository1.0-dev \
            libcairo2-dev pkg-config xvfb libfuse2 file
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Python packages
        run: python -m pip install --upgrade pip "pywebview[gtk]" pyinstaller
      - name: appimagetool
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool && sudo mv appimagetool /usr/local/bin/appimagetool
      - name: Build
        run: sh build_linux.sh
      - name: Smoke test (a virtual display, an isolated data folder)
        run: |
          export RAZORCAD_DATA_DIR="$PWD/smoke"
          mkdir -p "$RAZORCAD_DATA_DIR"
          xvfb-run -a timeout 40 ./dist/RazorCAD || true
          ls -la "$RAZORCAD_DATA_DIR"
          tail -n 20 "$RAZORCAD_DATA_DIR"/session-*.log || true
          grep -q "Geometry kernel ready" "$RAZORCAD_DATA_DIR"/session-*.log
      - uses: actions/upload-artifact@v6
        with:
          name: RazorCAD-linux
          path: RazorCAD-*-x86_64.AppImage
