# The regression tests (tests/run_tests.py) on every push and pull request: the test parts rebuilt with the real
# geometry kernel, the drawings compared with the stored ones, and the UI checks, in headless Microsoft Edge on
# Windows (the runner has Edge installed, so Playwright needs no browser download).
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: windows-latest
    # (the runner takes some 40 times as long as a desktop PC: the whole run, about 85 s on one, took near 30 min)
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: python -m pip install --upgrade pip playwright
      - name: Check updater handoff
        run: python -m unittest discover -s tests -p test_updater.py -v
      # (the test times of earlier runs, so slowdowns are reported; each run stores its own)
      - uses: actions/cache@v5
        with:
          path: tests/perf-history.json
          key: perf-${{ runner.os }}-${{ github.run_id }}
          restore-keys: perf-${{ runner.os }}-
      - name: Run the regression tests
        run: python tests/run_tests.py
        env:
          CI: 'true'
